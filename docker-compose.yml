# Local infrastructure for development: PostgreSQL (game data) and Redis (BullMQ job queue).
# The apps themselves run on the host with `pnpm dev`.
#   docker compose up -d     start (data survives restarts in named volumes)
#   docker compose down -v   stop and wipe all data
name: ashen-contracts

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ashen
      POSTGRES_PASSWORD: ashen
      POSTGRES_DB: ashen_contracts
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ashen -d ashen_contracts']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    # AOF persistence keeps queued jobs across container restarts (see DECISIONS.md #001);
    # BullMQ requires `noeviction`, otherwise Redis may silently drop job keys under memory pressure.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
