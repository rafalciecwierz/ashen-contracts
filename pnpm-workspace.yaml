packages:
  - 'apps/*'
  - 'packages/*'

# Shared dependency versions, referenced as "catalog:" in each package.json
catalog:
  typescript: ~6.0.3
  # One Zod for the apps and packages/shared: schemas built in shared are extended in the web app
  zod: ^4.6.5
  # One Playwright for the Storybook browser tests (packages/ui) and the e2e tests (apps/e2e),
  # so both use the same downloaded browser build. Tilde: a minor version brings a new browser
  # build (`playwright install` again), so bump it on purpose
  '@playwright/test': ~1.63.0
  playwright: ~1.63.0

allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  bcrypt: true
  esbuild: true
  prisma: true
  # Hooks are installed by the root `prepare` script instead of this package's postinstall
  simple-git-hooks: false
  unrs-resolver: true
