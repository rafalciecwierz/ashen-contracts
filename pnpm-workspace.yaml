packages:
  - 'apps/*'
  - 'packages/*'

# Shared dependency versions, referenced as "catalog:" in each package.json
catalog:
  typescript: ~6.0.3

allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  bcrypt: true
  esbuild: true
  prisma: true
  # Hooks are installed by the root `prepare` script instead of this package's postinstall
  simple-git-hooks: false
  unrs-resolver: true
