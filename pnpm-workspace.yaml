packages:
  - 'apps/*'
  - 'packages/*'

# Shared dependency versions, referenced as "catalog:" in each package.json
catalog:
  typescript: ~5.9.3

allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  bcrypt: true
  esbuild: true
  prisma: true
  unrs-resolver: true
