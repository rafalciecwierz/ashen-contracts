<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Location art</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Metamorphous&family=EB+Garamond:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="round-3/reliquary.css" />
    <style>
      body {
        background: var(--char);
        color: var(--bone);
        font-family: 'EB Garamond', Georgia, serif;
        margin: 0;
      }
      main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 16px 64px;
      }
      h1 {
        font-family: 'Metamorphous', serif;
        color: var(--bronze-hi);
        font-weight: 400;
      }
      p {
        color: var(--bone-dim);
        max-width: 72ch;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
        gap: 20px;
        margin-top: 24px;
      }
      figure {
        margin: 0;
      }
      figure img {
        display: block;
        width: 100%;
        aspect-ratio: 1200 / 420;
        object-fit: cover;
        border: 2px solid var(--bronze-dk);
        outline: 1px solid var(--bronze);
        outline-offset: 3px;
      }
      figcaption {
        margin-top: 10px;
        font-size: 17px;
      }
      figcaption b {
        font-family: 'Metamorphous', serif;
        font-weight: 400;
        color: var(--bronze-hi);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Location art</h1>
      <p>
        Every scene in <code>docs/design/assets/locations/</code>, rendered from
        its JSON spec by the <code>location-art</code> skill. A new scene must
        sit in this grid without standing out. The rules are in
        <code>.claude/skills/location-art/STYLE.md</code>.
      </p>
      <div class="grid" id="grid"></div>
    </main>
    <script>
      // [slug, name, description]; the skill appends a row for each new location
      const SCENES = [
        ['clearing', 'Clearing', 'Built in. A campfire among stumps.'],
        ['forest', 'Old forest', 'Built in. Layered pines in a dusk haze.'],
        ['mill', 'Abandoned mill', 'Built in. A mill wheel over still water.'],
        ['unknown', 'Unknown', 'Built in. A tower lost in the night fog.'],
        [
          'graveyard',
          'Graveyard',
          'Skill test. Leaning headstones under the moon by a ruined chapel.',
        ],
        [
          'wolf-den',
          "Wolves' den",
          'Skill test. A cave in the hills with firelight inside and rocks at its mouth.',
        ],
        [
          'marsh',
          'Drowned marsh',
          "Skill test. A witch's hut with a lit window across the reeds.",
        ],
      ];
      document.getElementById('grid').innerHTML = SCENES.map(
        ([slug, name, text]) =>
          `<figure><img src="assets/locations/${slug}.svg" alt="" loading="lazy"><figcaption><b>${name}</b> · ${text}</figcaption></figure>`,
      ).join('');
    </script>
  </body>
</html>
