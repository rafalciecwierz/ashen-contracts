name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # For the API integration tests: GET /health pings a real database. Same image
    # and credentials as docker-compose.yml, which the DATABASE_URL in
    # apps/api/vitest.config.integration.mts points at.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ashen
          POSTGRES_PASSWORD: ashen
          POSTGRES_DB: ashen_contracts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ashen -d ashen_contracts"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so commitlint can read every commit in the pushed range.
          fetch-depth: 0

      # Installs the pnpm version pinned in the root package.json `packageManager` field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only the commits this push or PR adds; older history predates the convention.
      # SHAs come in through env, not inline ${{ }}, so nothing is interpolated into the script.
      - name: Lint commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            pnpm exec commitlint --from "$PR_BASE" --to "$PR_HEAD" --verbose
          elif git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            pnpm exec commitlint --from "$PUSH_BEFORE" --to "$PUSH_AFTER" --verbose
          else
            # New branch or force-push: the previous tip is unknown, so check the latest commit only.
            pnpm exec commitlint --last --verbose
          fi

      # Every step runs the root script, which runs that script in each workspace that defines it.
      # The Prisma client is generated by the API's postinstall hook during `pnpm install`;
      # web's typecheck script runs `next typegen` first (route types such as LayoutProps are gitignored).
      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # Storybook interaction tests in packages/ui run in headless Chromium.
      - name: Install Playwright browser
        run: pnpm --filter @ashen-contracts/ui exec playwright install --with-deps --only-shell chromium

      - name: Test
        run: pnpm test

      - name: API integration tests
        run: pnpm --filter api test:integration

      - name: Build
        run: |
          pnpm build
          pnpm --filter @ashen-contracts/ui build-storybook

  # Browser tests of the whole system (docs/DECISIONS.md #015), in parallel with `verify`.
  # Playwright builds and starts the API and the web app itself (apps/e2e/playwright.config.ts).
  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The e2e config creates and migrates its own ashen_contracts_e2e database on this server.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ashen
          POSTGRES_PASSWORD: ashen
          POSTGRES_DB: ashen_contracts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ashen -d ashen_contracts"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter e2e exec playwright install --with-deps --only-shell chromium

      - name: E2E tests
        run: pnpm test:e2e

      # The HTML report and the traces of retried tests, to debug a failure locally
      # (`pnpm --filter e2e exec playwright show-report <dir>` or https://trace.playwright.dev).
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 7

  # Publishes Storybook to Chromatic (docs/ARCHITECTURE.md, Deployment). On main, the build is
  # the public link in README and becomes the visual baseline; on a PR, Chromatic compares each
  # story with that baseline and shows the visual changes for review on chromatic.com.
  #
  # The job runs only when the CHROMATIC_PROJECT_TOKEN secret is available. A PR from a fork gets
  # no secrets, and the secret doesn't exist before the Chromatic project is set up; in both cases
  # the job is skipped instead of failing. A job-level `if` can't read secrets, so a tiny job checks
  # and passes the answer on.
  chromatic-token:
    name: Check for a Chromatic token
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: echo "present=$([ -n "$TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  chromatic:
    name: Publish Storybook to Chromatic
    needs: chromatic-token
    if: ${{ needs.chromatic-token.outputs.present == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          # Chromatic finds the baseline build through git history.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Built with pnpm here, so Chromatic uploads the result instead of guessing how to build it.
      - name: Build Storybook
        run: pnpm --filter @ashen-contracts/ui build-storybook

      - name: Publish to Chromatic
        uses: chromaui/action@v18
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: packages/ui
          storybookBuildDir: storybook-static
          # A visual change is for review on chromatic.com, not a CI failure;
          # a story that fails to render still fails the job.
          exitZeroOnChanges: true
          # What reaches main was reviewed in its PR, so it becomes the new baseline.
          autoAcceptChanges: main
